name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Unittest
        env:
          # Keep the repo root off sys.path at startup. A local packaging/
          # folder would otherwise shadow the PyPI package setuptools imports.
          PYTHONSAFEPATH: "1"
        run: python -m unittest discover -s tests -v
      - name: Wipe old OpenCode home and PATH, then install
        run: |
          set -euo pipefail
          CI_HOME="${RUNNER_TEMP}/oc-home"
          CUSTOM="${RUNNER_TEMP}/apps/opencode/bin"
          mkdir -p "$CI_HOME/.opencode/bin" "$CI_HOME/.config/opencode/agents" "$CUSTOM"
          echo old-binary > "$CI_HOME/.opencode/bin/opencode"
          echo leftover > "$CI_HOME/.opencode/old.txt"
          echo stale > "$CI_HOME/.config/opencode/agents/stale.md"
          echo custom-old > "$CUSTOM/opencode"
          python - <<PY
          import install
          from pathlib import Path
          home = Path(r"${CI_HOME}")
          custom = Path(r"${CUSTOM}")
          install.write_user_path(
              [str(custom), str(home / ".opencode" / "bin"), str(home / "keep-on-path")],
              None,
              user_home=home,
          )
          PY
          python install.py --root "$PWD" --user-home "$CI_HOME"
          test ! -f "$CI_HOME/.opencode/old.txt"
          test ! -e "$CI_HOME/.config/opencode"
          test -f "${CUSTOM}/opencode"
          backup=$(ls -d "$CI_HOME"/.opencode_backup_* | head -1)
          test -f "$backup/old.txt"
          cfg_backup=$(ls -d "$CI_HOME/.config"/opencode_backup_* | head -1)
          test -f "$cfg_backup/agents/stale.md"
          test -f "$CI_HOME/.opencode/agents/code-reviewer.md"
          test -f "$CI_HOME/.opencode/skills/cpp98/SKILL.md"
          python - <<PY
          import install
          from pathlib import Path
          home = Path(r"${CI_HOME}")
          custom = Path(r"${CUSTOM}")
          parts, handle = install.read_user_path(user_home=home)
          install.close_path_handle(handle, user_home=home)
          assert str(custom) not in parts, parts
          bins = [p for p in parts if install.is_opencode_bin_entry(p)]
          assert len(bins) == 1, parts
          assert any(Path(p).name == "keep-on-path" for p in parts), parts
          print("path-after-install", parts)
          PY
      - name: Stage Linux artifact
        id: art
        run: |
          set -euo pipefail
          dest=$(python packaging/build_artifact.py --os linux --out-dir dist | tail -n 1)
          test -f "$dest/vendor/bin/linux/opencode"
          ART_HOME="${RUNNER_TEMP}/oc-from-art"
          python "$dest/install.py" --root "$dest" --user-home "$ART_HOME" --require-binary
          test -x "$ART_HOME/.opencode/bin/opencode"
          test -f "$ART_HOME/.opencode/agents/code-reviewer.md"
          test ! -e "$ART_HOME/.config/opencode"
          echo "name=$(basename "$dest")" >> "$GITHUB_OUTPUT"
          echo "dir=$dest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: ${{ steps.art.outputs.dir }}/
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Unittest
        env:
          # Keep the repo root off sys.path at startup. A local packaging/
          # folder would otherwise shadow the PyPI package setuptools imports.
          PYTHONSAFEPATH: "1"
        run: python -m unittest discover -s tests -v
      - name: Wipe old OpenCode home and PATH, then install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ciHome = Join-Path $env:RUNNER_TEMP "oc-home"
          $custom = Join-Path $env:RUNNER_TEMP "apps\opencode\bin"
          New-Item -ItemType Directory -Force -Path (Join-Path $ciHome ".opencode\bin") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $ciHome ".config\opencode\agents") | Out-Null
          New-Item -ItemType Directory -Force -Path $custom | Out-Null
          Set-Content -Path (Join-Path $ciHome ".opencode\bin\opencode.exe") -Value "old-binary"
          Set-Content -Path (Join-Path $ciHome ".opencode\old.txt") -Value "leftover"
          Set-Content -Path (Join-Path $ciHome ".config\opencode\agents\stale.md") -Value "stale"
          Set-Content -Path (Join-Path $custom "opencode.exe") -Value "custom-old"
          python -c @"
          import install
          from pathlib import Path
          home = Path(r'$ciHome')
          custom = Path(r'$custom')
          install.write_user_path(
              [str(custom), str(home / '.opencode' / 'bin'), str(home / 'keep-on-path')],
              None,
              user_home=home,
          )
          "@
          python install.py --root $PWD --user-home $ciHome
          if (-not (Test-Path (Join-Path $custom "opencode.exe"))) { throw "custom install should stay on disk" }
          if (Test-Path (Join-Path $ciHome ".opencode\old.txt")) { throw "old tree still present" }
          $backup = Get-ChildItem -Path $ciHome -Directory -Filter ".opencode_backup_*" | Select-Object -First 1
          if (-not $backup) { throw "expected .opencode_backup_*" }
          if (-not (Test-Path (Join-Path $backup.FullName "old.txt"))) { throw "backup missing old.txt" }
          if (Test-Path (Join-Path $ciHome ".config\opencode")) { throw "must not rewrite ~/.config/opencode" }
          $cfgBackup = Get-ChildItem -Path (Join-Path $ciHome ".config") -Directory -Filter "opencode_backup_*" | Select-Object -First 1
          if (-not $cfgBackup) { throw "expected .config/opencode_backup_*" }
          if (-not (Test-Path (Join-Path $cfgBackup.FullName "agents\stale.md"))) { throw "config backup missing stale.md" }
          if (-not (Test-Path (Join-Path $ciHome ".opencode\agents\code-reviewer.md"))) { throw "code-reviewer agent missing" }
          if (-not (Test-Path (Join-Path $ciHome ".opencode\skills\cpp98\SKILL.md"))) { throw "cpp98 skill missing" }
          python -c @"
          import install
          from pathlib import Path
          home = Path(r'$ciHome')
          custom = Path(r'$custom')
          parts, handle = install.read_user_path(user_home=home)
          install.close_path_handle(handle, user_home=home)
          assert str(custom) not in parts, parts
          bins = [p for p in parts if install.is_opencode_bin_entry(p)]
          assert len(bins) == 1, parts
          assert any(Path(p).name == 'keep-on-path' for p in parts), parts
          print('path-after-install', parts)
          "@
      - name: Stage Windows artifact
        id: art
        shell: pwsh
        run: |
          $dest = (python packaging/build_artifact.py --os windows --out-dir dist | Select-Object -Last 1).Trim()
          $cli = Join-Path $dest "vendor\bin\windows\opencode.exe"
          if (-not (Test-Path $cli)) { throw "missing $cli" }
          $artHome = Join-Path $env:RUNNER_TEMP "oc-from-art"
          python (Join-Path $dest "install.py") --root $dest --user-home $artHome --require-binary
          if (-not (Test-Path (Join-Path $artHome ".opencode\bin\opencode.exe"))) { throw "CLI missing after artifact install" }
          if (-not (Test-Path (Join-Path $artHome ".opencode\agents\code-reviewer.md"))) { throw "agent missing after artifact install" }
          if (Test-Path (Join-Path $artHome ".config\opencode")) { throw "artifact install must not write ~/.config/opencode" }
          $name = Split-Path -Leaf $dest
          Add-Content -Path $env:GITHUB_OUTPUT -Value "name=$name"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "dir=$dest"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: ${{ steps.art.outputs.dir }}/
          if-no-files-found: error
          retention-days: 30
